<!-- Floating Chatbot Widget for SharePoint Embed Web Part -->
<div id="chatbot-widget-root">
  <style>
    #chatbot-widget-root * { box-sizing: border-box; font-family: Segoe UI, Arial, sans-serif; }

    #cb-toggle-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      background: #185ABD;
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    #cb-toggle-btn:hover { background: #12408a; }

    #cb-panel {
      position: fixed;
      bottom: 90px;
      right: 24px;
      width: 340px;
      height: 460px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 9999;
    }
    #cb-panel.open { display: flex; }

    #cb-header {
      background: #185ABD;
      color: #fff;
      padding: 12px 16px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #cb-close { cursor: pointer; font-size: 18px; }

    #cb-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      font-size: 14px;
      background: #f7f9fb;
    }
    .cb-msg { margin-bottom: 10px; max-width: 85%; padding: 8px 12px; border-radius: 8px; line-height: 1.4; }
    .cb-msg.user { background: #185ABD; color: #fff; margin-left: auto; border-bottom-right-radius: 2px; }
    .cb-msg.bot { background: #e9edf1; color: #222; margin-right: auto; border-bottom-left-radius: 2px; }

    #cb-input-row {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 8px;
      gap: 6px;
    }
    #cb-input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
    }
    #cb-send {
      background: #185ABD;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0 14px;
      cursor: pointer;
      font-size: 14px;
    }
    #cb-send:hover { background: #12408a; }
  </style>

  <button id="cb-toggle-btn">💬 Ask now</button>

  <div id="cb-panel">
    <div id="cb-header">
      <span>Ask the Assistant</span>
      <span id="cb-close">✕</span>
    </div>
    <div id="cb-messages">
      <div class="cb-msg bot">Hi! Ask me anything about the site content.</div>
    </div>
    <div id="cb-input-row">
      <input id="cb-input" type="text" placeholder="Type your question..." />
      <button id="cb-send">Send</button>
    </div>
  </div>

  <script>
    (function () {
      // DEMO MODE: no backend call, just canned responses
      var DEMO_RESPONSES = [
        "That's a great question! In a full version, I'd pull this answer from our knowledge base.",
        "I found a few relevant documents on the site — here's a summary (demo text).",
        "Let me check that for you... this is a placeholder answer for the demo.",
        "Here's what I found: this is sample text standing in for a real AI response."
      ];

      var toggleBtn = document.getElementById("cb-toggle-btn");
      var panel = document.getElementById("cb-panel");
      var closeBtn = document.getElementById("cb-close");
      var messages = document.getElementById("cb-messages");
      var input = document.getElementById("cb-input");
      var sendBtn = document.getElementById("cb-send");

      toggleBtn.addEventListener("click", function () {
        panel.classList.toggle("open");
        if (panel.classList.contains("open")) input.focus();
      });
      closeBtn.addEventListener("click", function () {
        panel.classList.remove("open");
      });

      function addMessage(text, sender) {
        var div = document.createElement("div");
        div.className = "cb-msg " + sender;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      function sendMessage() {
        var text = input.value.trim();
        if (!text) return;
        addMessage(text, "user");
        input.value = "";

        addMessage("Thinking...", "bot");
        var thinkingEl = messages.lastChild;

        // Simulate network delay, then show a random canned response
        setTimeout(function () {
          var reply = DEMO_RESPONSES[Math.floor(Math.random() * DEMO_RESPONSES.length)];
          thinkingEl.textContent = reply;
        }, 800);
      }

      sendBtn.addEventListener("click", sendMessage);
      input.addEventListener("keypress", function (e) {
        if (e.key === "Enter") sendMessage();
      });
    })();
  </script>
</div>
